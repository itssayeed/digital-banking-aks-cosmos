apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finbanking-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: finbanking-api-svc
            port:
              number: 80
  - host: finbanking.local
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: finbanking-api-svc
            port:
              number: 80
