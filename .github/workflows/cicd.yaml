name: AKS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: finbanking.api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to ACR
      run: |
        az acr login --name $ACR_LOGIN_SERVER

    - name: Build and push image to ACR
      run: |
        IMAGE_TAG=v${{ github.run_number }}
        FULL_IMAGE=$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
        echo "Building image: $FULL_IMAGE"
        docker build -t $FULL_IMAGE ./FinBanking.API
        docker push $FULL_IMAGE
        echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

  deploy-to-aks:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group dbanking-rg \
          --name dbanking-aks \
          --overwrite-existing

    - name: Replace image in Kubernetes deployment
      run: |
        sed -i "s|IMAGE_PLACEHOLDER|${FULL_IMAGE}|g" k8s-deployment.yaml

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s-deployment.yaml
        kubectl apply -f k8s-service.yaml
