name: CI/CD Pipeline

on:
  push:
    branches:
      - main          # runs automatically when pushing to main
  workflow_dispatch:   # allows manual "Run workflow" from GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push Docker image
  run: |
    IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/finbanking-api:v${{ github.run_number }}
    docker build -t $IMAGE ./FinBanking.API
    docker push $IMAGE
